    </div>
    <div class="steps-grid">
      <div class="step-card">
        <div class="step-num">01</div>
        <div class="step-icon">🎮</div>
        <h3>Pick a Game</h3>
        <p>Browse our game list and select the game you want to top up.</p>
      </div>
      <div class="step-arrow">→</div>
      <div class="step-card">
        <div class="step-num">02</div>
        <div class="step-icon">🛒</div>
        <h3>Choose Package</h3>
        <p>Select your preferred denomination and enter your game ID.</p>
      </div>
      <div class="step-arrow">→</div>
      <div class="step-card">
        <div class="step-num">03</div>
        <div class="step-icon">✅</div>
        <h3>Pay & Done!</h3>
        <p>Complete your payment and receive your top-up instantly.</p>
      </div>
    </div>
  </section>

